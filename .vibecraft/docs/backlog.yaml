phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Главная страница генератора семантического ядра
    description: >-
      Создать главную страницу приложения: поле для ввода темы продажи и кнопка
      генерации, а также область для отображения результата со статическими
      данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы и логика генерации пока не нужны.
    priority: high
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Поле ввода темы и кнопка генерации видны и работают
      - Результат отображается из статических заглушек
    depends_on: []
    related_feature: Генерация семантического ядра
    status: completed
    summary:
      Реализована главная страница генератора семантического ядра. Клиентский
      компонент components/semantic-core-generator.tsx содержит поле ввода темы,
      кнопку «Сгенерировать» и область результата со статическими заглушками
      (ключевые слова и поисковые запросы). Страница app/page.tsx выводит
      заголовок и генератор. Проверки typecheck, lint и build проходят.
  - id: task-002
    phase: mvp
    title: Генерация семантического ядра по теме
    description: >-
      Реализовать реальную генерацию: пользователь вводит тему продажи, нажимает
      кнопку, и по ней формируется семантическое ядро — набор релевантных Авито
      ключевых слов и поисковых запросов.

      Сгенерированный список понятно отображается на странице.
    priority: high
    acceptance_criteria:
      - По введённой теме создаётся список ключевых слов и запросов
      - Результат релевантен теме и ориентирован на Авито
      - Результат отображается без ошибок
    depends_on:
      - task-001
    related_feature: Генерация семантического ядра
    status: completed
    summary:
      Реализована реальная генерация семантического ядра по введённой теме.
      Чистая функция generateSemanticCore в lib/semantic-core.ts на основе темы
      формирует релевантный набор ключевых слов и поисковых запросов,
      ориентированный на Авито (купить, оптом, недорого, на авито и др.).
      Компонент components/semantic-core-generator.tsx вызывает генератор по
      кнопке, показывает состояние загрузки и отображает результат без ошибок.
      Проверки typecheck, lint и build проходят.
  - id: task-003
    phase: mvp
    title: История сохранённых семантических ядер
    description: Каждая созданная генерация сохраняется в истории. На странице
      отображается список сохранённых тем, и при выборе темы открывается её
      семантическое ядро. История сохраняется между сессиями.
    priority: medium
    acceptance_criteria:
      - Список сохранённых тем отображается
      - При выборе темы открывается её семантическое ядро
      - История сохраняется между сессиями
    depends_on:
      - task-002
    related_feature: История генераций
    status: completed
    summary:
      Реализована история сохранённых семантических ядер. Каждая генерация
      сохраняется через API app/api/generations/route.ts в таблицу DynamoDB
      generations (модели и типы в lib/models.ts, mock-фолбэк в
      lib/mock-data.ts, zod-валидация в lib/validation/generation.ts).
      Клиентский компонент components/semantic-core-generator.tsx выводит список
      сохранённых тем, при выборе темы открывается её семантическое ядро;
      история загружается на сервере (app/page.tsx) и сохраняется между
      сессиями. Проверки typecheck, lint и build проходят.
  - id: task-004
    phase: mvp
    title: Выгрузка готового семантического ядра
    description:
      Реализовать копирование и скачивание готового семантического ядра
      целиком, чтобы перенести результат в другое место (текст).
    priority: medium
    acceptance_criteria:
      - Кнопка копирования результата работает
      - Кнопка скачивания результата работает
      - Выходные данные можно перенести в другое место
    depends_on:
      - task-003
    related_feature: Выгрузка результата
    status: completed
    summary: Реализовано копирование и скачивание готового семантического ядра
      целиком. В components/semantic-core-generator.tsx добавлены кнопки
      «Копировать» (navigator.clipboard с индикацией «Скопировано») и «Скачать»
      (загрузка .txt-файла) для выбранного ядра. Вспомогательная функция
      formatCoreAsText формирует текст из ключевых слов и поисковых запросов,
      что позволяет перенести результат в другое место. Проверки typecheck, lint
      и build проходят.
  - id: task-005
    phase: mvp
    title: Избранные ключевые слова
    description:
      В каждом семантическом ядре можно отмечать полезные ключевые слова
      как избранные. Отмеченные слова объединяются в отдельный список,
      сохраняются и доступны для выгрузки.
    priority: low
    acceptance_criteria:
      - Возле ключевых слов есть действие «отметить избранное»
      - Избранные слова объединяются в отдельный список
      - Избранное сохраняется и доступно для выгрузки
    depends_on:
      - task-003
    related_feature: Избранные ключевые слова
    status: completed
    summary:
      Реализовано избранное для ключевых слов. Возле каждого ключевого слова
      в открытом ядре есть кнопка-сердечко «отметить избранное», отмеченные
      слова объединяются в отдельный список «Избранные ключевые слова» на
      странице. Избранное сохраняется в таблицу DynamoDB favorites (модели в
      lib/models.ts, mock-фолбэк в lib/mock-data.ts, zod-валидация в
      lib/validation/favorite.ts, API app/api/favorites/route.ts) и доступно для
      выгрузки через кнопки «Копировать» и «Скачать». Основная реализация UI — в
      components/semantic-core-generator.tsx. Проверки typecheck, lint и build
      проходят.
  - id: task-006
    phase: mvp
    title: Частотность ключевых слов
    description: Для каждого ключевого слова и запроса в семантическом ядре
      отображается приблизительная оценка частотности, рассчитанная на основе
      темы и структуры запроса (купить, оптом, недорого и т.д.). Частотность
      помогает авитологу оценить спрос по каждому слову. Значения частотности
      включаются в выгрузку результата.
    priority: medium
    acceptance_criteria:
      - Возле ключевых слов отображается приблизительная частотность
      - Частотность корректно рассчитывается по введённой теме
      - Значения частотности попадают в выгрузку результата
    depends_on:
      - task-002
    related_feature: Частотность ключевых слов
    status: completed
    summary: "Реализована приблизительная частотность ключевых слов и запросов.
      Функции estimateFrequency и formatFrequency в lib/semantic-core.ts
      рассчитывают оценку (число запросов в месяц) на основе темы и структуры
      запроса: базовая частотность зависит от специфичности темы, а модификаторы
      (купить, оптом, недорого и др.) и длина фразы снижают оценку. Возле
      каждого ключевого слова и запроса в components/semantic-core-generator.tsx
      отображается значение «≈ N / мес», частотность включена в выгрузку
      (копирование и скачивание) через formatCoreAsText. Проверки typecheck,
      lint и build проходят."
  - id: task-007
    phase: mvp
    title: Счётчик использования ИИ
    description: "Добавить в приложение счётчик использования ИИ: количество
      выполненных генераций и примерный расход токенов. Счётчик показывает
      текущее состояние и настраиваемый порог лимита, но не блокирует генерацию.
      При достижении лимита показывается уведомление."
    priority: medium
    acceptance_criteria:
      - Счётчик количества генераций отображается на странице
      - Расход токенов отображается на странице
      - Показания счётчика сохраняются между сессиями
      - Достижение лимита показывает уведомление, но не блокирует работу
    depends_on:
      - task-002
    related_feature: Счётчик использования ИИ
    status: completed
    summary:
      Реализован счётчик использования ИИ. Добавлена таблица DynamoDB usage
      (lib/schema.ts), модели и функции getUsage/saveUsage (lib/models.ts),
      mock-фолбэк (lib/mock-data.ts), zod-валидация (lib/validation/usage.ts) и
      API app/api/usage/route.ts (GET/PUT). Счётчик генераций и расход токенов
      отображаются на странице и сохраняются между сессиями. Лимит
      настраивается, при достижении лимита показывается уведомление, генерация
      не блокируется. Основная реализация расположена в компонентах
      components/usage-provider.tsx и components/usage-counter.tsx, подключение
      в app/page.tsx, инкремент при генерации в
      components/semantic-core-generator.tsx. Проверки typecheck, lint и build
      проходят.
  - id: task-008
    phase: mvp
    title: Проверка актуальной информации о тарифах Яндекс AI Studio
    description:
      "Проверить актуальную информацию о кабинете Яндекс AI Studio: где в
      интерфейсе находится раздел с тарифами и лимитами, и какое сейчас значение
      бесплатного лимита YandexGPT (в токенах и/или запросах). Дать пользователю
      понятный ответ с точным путём по кабинету."
    priority: low
    acceptance_criteria:
      - Дан точный путь к разделу тарифов/лимитов в кабинете Яндекс AI Studio
      - Указано актуальное значение бесплатного лимита YandexGPT (токены/запросы)
      - Ответ понятен пользователю без технических подробностей
    depends_on: []
    related_feature: Счётчик использования ИИ
    status: completed
    summary:
      "Проведено исследование актуальных тарифов и лимитов Яндекс AI Studio.
      Раздел тарифов/лимитов в кабинете aistudio.yandex.ru — меню «Тарифы»
      (технические квоты и лимиты описаны в документации «Квоты и лимиты»,
      aistudio.yandex.ru/docs/ru/ai-studio/concepts/limits.html). Фиксированного
      бесплатного лимита YandexGPT в токенах/запросах сейчас нет: с 19.09.2025
      бесплатные запросы без привязанного платёжного аккаунта отключены, для API
      нужен billing account и стартовый грант, фактическое значение лимита
      показывается в кабинете в разделе «Тарифы» под конкретный аккаунт."
  - id: task-009
    phase: mvp
    title: Серверная интеграция YandexGPT через .env
    description: "Подключить серверную интеграцию с Яндекс AI Studio (YandexGPT
      API). API-ключ хранится в переменной окружения (.env) и используется
      только на сервере: серверные запросы ходят в YandexGPT, ключ не попадает в
      браузер. Если ключ не задан, приложение продолжает работать на текущей
      приблизительной генерации без ошибок."
    priority: high
    acceptance_criteria:
      - Сервер читает API-ключ YandexGPT из переменной окружения .env
      - Ключ не передаётся в браузер и не виден клиенту
      - При отсутствии ключа приложение продолжает работать на приблизительной
        генерации
    depends_on:
      - task-002
    related_feature: Генерация семантического ядра
    status: completed
    summary:
      Реализована серверная интеграция с Яндекс AI Studio (YandexGPT API).
      Модуль lib/yandexgpt.ts помечен `import "server-only"` и читает API-ключ
      только на сервере из переменной окружения YANDEXGPT_API_KEY (не имеет
      префикса NEXT_PUBLIC_, поэтому не попадает в браузер; импорт из
      клиентского кода приводит к ошибке сборки). Функции
      isYandexGptConfigured/getYandexGptConfig/callYandexGpt безопасно
      возвращают null/false при отсутствии ключа, поэтому приложение продолжает
      работать на прежней приблизительной генерации. Документация переменной
      добавлена в .env.example и .env.docker. Проверки typecheck, lint и build
      проходят.
  - id: task-010
    phase: mvp
    title: Генерация ядра и частотности через YandexGPT
    description:
      Использовать YandexGPT для генерации семантического ядра и оценки
      частотности. Когда API-ключ задан, по теме формируется ядро через модель,
      частотность оценивается моделью. При отсутствии ключа сохраняется прежняя
      приблизительная логика, чтобы приложение не ломалось.
    priority: high
    acceptance_criteria:
      - Генерация ядра выполняется через YandexGPT, если ключ задан
      - Частотность оценивается моделью на основе темы
      - При отсутствии ключа сохраняется прежняя приблизительная генерация
    depends_on:
      - task-009
    related_feature: Генерация семантического ядра
    status: completed
    summary:
      Реализована генерация ядра и частотности через YandexGPT. Если задан
      API-ключ, модель генерирует ключевые слова, поисковые запросы и оценивает
      частотность по теме. Серверная логика в lib/server/generate-core.ts
      вызывает callYandexGpt, разбирает JSON ответа и при недоступности ключа
      или ошибке разбора откатывается к прежней приблизительной генерации
      (lib/semantic-core.ts). Новый эндпоинт app/api/generate/route.ts отдаёт
      ядро с частотностью; клиент components/semantic-core-generator.tsx
      генерирует через него, сохраняет частотности в history
      (Generation.frequencies, schema/validation расширены) и отображает их, с
      fallback на estimateFrequency для старых записей. При отсутствии ключа
      поведение не меняется. Проверки typecheck, lint и build проходят.
  - id: task-011
    phase: mvp
    title: Создать файл .env для API-ключа YandexGPT
    description:
      Создать в корне проекта файл .env с переменной YANDEXGPT_API_KEY
      (пустой, для вставки пользователем своего API-ключа Яндекс AI Studio),
      чтобы серверная интеграция YandexGPT могла читать ключ. Файл .env —
      локальный секрет и не должен попадать в репозиторий.
    priority: high
    acceptance_criteria:
      - Файл .env создан в корне проекта
      - В .env есть переменная YANDEXGPT_API_KEY (пустая, для вставки ключа
        пользователем)
      - Файл .env не попадает в репозиторий (исключён через .gitignore)
    depends_on: []
    related_feature: Генерация семантического ядра
    status: completed
    summary:
      Создан файл .env в корне проекта с пустой переменной YANDEXGPT_API_KEY
      для вставки пользовательского API-ключа Яндекс AI Studio. Файл исключён из
      репозитория через .gitignore (правило .env). Проверки typecheck, lint и
      build проходят успешно.
  - id: task-012
    phase: mvp
    title: Перезапуск и проверка интеграции YandexGPT
    description: Перезапустить приложение в облачном окружении и проверить, что
      серверная интеграция YandexGPT корректно читает API-ключ из переменной
      окружения (.env.docker). Убедиться, что приложение работает без ошибок и
      понятно, в каком режиме (реальный ключ или приблизительная генерация) оно
      работает.
    priority: high
    acceptance_criteria:
      - Приложение перезапущено и работает без ошибок
      - Проверено, что интеграция YandexGPT корректно читает переменную
        окружения из .env.docker
      - Понятно для пользователя, подключён ли ключ или работает приблизительная
        генерация
    depends_on:
      - task-011
    related_feature: Генерация семантического ядра
    status: completed
    summary: 'Приложение перезапущено в облачном окружении (docker compose up -d
      --force-recreate app), теперь контейнер корректно читает YANDEXGPT_API_KEY
      и YANDEXGPT_FOLDER_ID из .env.docker. Интеграция проверена: POST
      /api/generate возвращает usedModel=true и реалистичные частотности от
      модели YandexGPT. В интерфейс (components/semantic-core-generator.tsx и
      app/page.tsx) добавлен индикатор режима: "YandexGPT подключён — реальная
      генерация" либо "Приблизительная генерация". typecheck, lint и build
      проходят без ошибок.'
  - id: task-013
    phase: mvp
    title: Починить копирование семантического ядра
    description: Исправить кнопку «Копировать» для выгрузки семантического ядра.
      Сейчас используется navigator.clipboard, который может блокироваться
      браузером в контексте через прокси/iframe или без secure context. Сделать
      надёжное копирование с запасным способом (скрытый textarea +
      document.execCommand), чтобы результат всегда попадал в буфер обмена.
      Кнопка «Скачать» должна продолжать сохранять текст в файл.
    priority: high
    acceptance_criteria:
      - Кнопка «Копировать» помещает семантическое ядро в буфер обмена
      - Копирование работает надёжно через прокси и в разных окружениях
      - При недоступности стандартного способа копирования используется запасной
        фолбэк
    depends_on:
      - task-004
    related_feature: Выгрузка результата
    status: completed
    summary: >-
      Починено копирование семантического ядра. Добавлен надёжный хелпер
      copyToClipboard в lib/clipboard.ts, который сначала пробует
      navigator.clipboard, а при неудаче переходит к запасному способу (скрытый
      textarea + document.execCommand), работающему через прокси/iframe и без
      secure context. Хелпер подключён в
      components/semantic-core-generator.tsx к кнопкам «Копировать» для ядра и
      избранного; кнопка «Скачать» по-прежнему сохраняет текст в .txt-файл.
      Проверки typecheck, lint и build проходят.
